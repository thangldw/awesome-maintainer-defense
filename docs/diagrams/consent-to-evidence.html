<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consent to evidence — Awesome Maintainer Defense</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --accent-tint:rgba(235,108,54,.08); --rule:rgba(45,49,66,.12); --link:#2e5aa8; }
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px 32px; background:var(--paper); color:var(--ink); font-family:'Geist',system-ui,sans-serif; }
    .frame { width:100%; max-width:1280px; }
    .eyebrow { margin-bottom:8px; color:var(--muted); font:500 12px/1 'Geist Mono',ui-monospace,monospace; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin-bottom:24px; color:var(--ink); font:400 clamp(28px,3vw,40px)/1.08 'Instrument Serif',serif; letter-spacing:-.02em; }
    svg { width:100%; min-width:900px; display:block; }
    .lane-tint { fill:rgba(45,49,66,.018); }
    .lane-rule { stroke:var(--rule); stroke-width:1; }
    .lane-name,.step-label,.legend-label { fill:var(--muted); font:500 8px 'Geist Mono',ui-monospace,monospace; letter-spacing:.12em; text-anchor:middle; }
    .step-chip { fill:rgba(45,49,66,.12); }
    .step-chip--accent { fill:rgba(235,108,54,.20); }
    .step-number { fill:var(--ink); font:600 8px 'Geist Mono',ui-monospace,monospace; text-anchor:middle; }
    .node rect { fill:#fff; stroke:rgba(45,49,66,.28); stroke-width:1; }
    .node--accent rect { fill:var(--accent-tint); stroke:var(--accent); stroke-width:1.5; }
    .node-tag { fill:var(--muted); font:500 8px 'Geist Mono',ui-monospace,monospace; letter-spacing:.08em; }
    .node-name { fill:var(--ink); font:600 12px 'Geist',system-ui,sans-serif; text-anchor:middle; }
    .node-sub { fill:var(--soft); font:400 8px 'Geist Mono',ui-monospace,monospace; text-anchor:middle; }
    .connector { fill:none; stroke:var(--muted); stroke-width:1.2; }
    .connector--accent { stroke:var(--accent); stroke-width:1.2; }
    .connector--link { stroke:var(--link); stroke-width:1.2; }
    .flow-label { fill:var(--muted); font:400 8px 'Geist Mono',ui-monospace,monospace; text-anchor:middle; }
    .legend-text { fill:var(--ink); font:500 12px 'Geist',system-ui,sans-serif; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Consent-gated evidence · Data flow · doc-wide</p>
    <h1>Only authorized, disclosure-scoped evidence reaches publication</h1>
    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="consent-to-evidence-title consent-to-evidence-desc">
      <title id="consent-to-evidence-title">Consent-to-evidence pilot data flow</title>
      <desc id="consent-to-evidence-desc">Maintainer authority leads to a pinned offline audit, explicit labels and disclosure choice, a deterministic bundle, and publication limited to permitted fields; unresolved labels remain visible.</desc>
      <defs>
        <marker id="consent-to-evidence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4f5d75"/></marker>
        <marker id="consent-to-evidence-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#eb6c36"/></marker>
        <marker id="consent-to-evidence-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="1280" height="720" fill="#f5f5f5"/>
      <rect class="lane-tint" x="136" y="96" width="1104" height="112"/>
      <rect class="lane-tint" x="136" y="320" width="1104" height="112"/>
      <path class="lane-rule" d="M40 96 H1240 M40 208 H1240 M40 320 H1240 M40 432 H1240 M40 544 H1240 M136 64 V544" fill="none"/>
      <text class="lane-name" x="84" y="148">AUTHORITY</text>
      <text class="lane-name" x="84" y="260">INSPECTION</text>
      <text class="lane-name" x="84" y="372">REVIEW</text>
      <text class="lane-name" x="84" y="484">PUBLICATION</text>

      <g>
        <rect class="step-chip" x="184" y="64" width="32" height="20" rx="10"/><text class="step-number" x="200" y="80">01</text><text class="step-label" x="200" y="92">CONSENT</text>
        <rect class="step-chip" x="360" y="64" width="32" height="20" rx="10"/><text class="step-number" x="376" y="80">02</text><text class="step-label" x="376" y="92">PIN</text>
        <rect class="step-chip" x="536" y="64" width="32" height="20" rx="10"/><text class="step-number" x="552" y="80">03</text><text class="step-label" x="552" y="92">AUDIT</text>
        <rect class="step-chip" x="712" y="64" width="32" height="20" rx="10"/><text class="step-number" x="728" y="80">04</text><text class="step-label" x="728" y="92">LABEL</text>
        <rect class="step-chip step-chip--accent" x="888" y="64" width="32" height="20" rx="10"/><text class="step-number" x="904" y="80" fill="#eb6c36">05</text><text class="step-label" x="904" y="92" fill="#eb6c36">DECIDE</text>
        <rect class="step-chip" x="1064" y="64" width="32" height="20" rx="10"/><text class="step-number" x="1080" y="80">06</text><text class="step-label" x="1080" y="92">PUBLISH</text>
      </g>

      <path class="connector" d="M272 152 H368 Q376 152 376 160 V228" marker-end="url(#consent-to-evidence-arrow)"/>
      <path class="connector" d="M448 264 H480" marker-end="url(#consent-to-evidence-arrow)"/>
      <path class="connector" d="M624 264 H720 Q728 264 728 272 V336" marker-end="url(#consent-to-evidence-arrow)"/>
      <path class="connector connector--accent" d="M800 376 H832" marker-end="url(#consent-to-evidence-arrow-accent)"/>
      <path class="connector connector--accent" d="M976 376 H1072 Q1080 376 1080 384 V448" marker-end="url(#consent-to-evidence-arrow-accent)"/>
      <path class="connector connector--link" d="M1080 448 V188" marker-end="url(#consent-to-evidence-arrow-link)"/>
      <rect x="992" y="288" width="176" height="24" rx="4" fill="#f5f5f5"/>
      <text class="flow-label" x="1080" y="304">permitted fields only</text>

      <g class="node" data-node="maintainer-consent">
        <rect x="128" y="116" width="144" height="72" rx="8"/>
        <text class="node-tag" x="140" y="136">MAINTAINER</text>
        <text class="node-name" x="200" y="160">Authority + consent</text>
        <text class="node-sub" x="200" y="180">role · disclosure intent</text>
      </g>
      <g class="node" data-node="pinned-checkout">
        <rect x="304" y="228" width="144" height="72" rx="8"/>
        <text class="node-tag" x="316" y="248">PINNED INPUT</text>
        <text class="node-name" x="376" y="272">Repository checkout</text>
        <text class="node-sub" x="376" y="292">full target SHA</text>
      </g>
      <g class="node" data-node="offline-report">
        <rect x="480" y="228" width="144" height="72" rx="8"/>
        <text class="node-tag" x="492" y="248">OFFLINE</text>
        <text class="node-name" x="552" y="272">Audit reports</text>
        <text class="node-sub" x="552" y="292">raw + effective</text>
      </g>
      <g class="node" data-node="maintainer-labels">
        <rect x="656" y="336" width="144" height="80" rx="8"/>
        <text class="node-tag" x="668" y="356">HUMAN LABELS</text>
        <text class="node-name" x="728" y="380">Finding review</text>
        <text class="node-sub" x="728" y="400">TP · FP · N/A</text>
        <text class="node-sub" x="728" y="412">UNRESOLVED stays visible</text>
      </g>
      <g class="node node--accent" data-node="disclosure-choice">
        <rect x="832" y="336" width="144" height="80" rx="8"/>
        <text class="node-tag" x="844" y="356" fill="#eb6c36">CONSENT GATE</text>
        <text class="node-name" x="904" y="380">Disclosure choice</text>
        <text class="node-sub" x="904" y="400">public · sanitized</text>
        <text class="node-sub" x="904" y="412">private</text>
      </g>
      <g class="node" data-node="deterministic-bundle">
        <rect x="1008" y="448" width="144" height="80" rx="8"/>
        <text class="node-tag" x="1020" y="468">GENERATED</text>
        <text class="node-name" x="1080" y="492">Evidence bundle</text>
        <text class="node-sub" x="1080" y="512">JSON + Markdown</text>
        <text class="node-sub" x="1080" y="524">pinned provenance</text>
      </g>
      <g class="node" data-node="permitted-publication">
        <rect x="1008" y="116" width="144" height="72" rx="8"/>
        <text class="node-tag" x="1020" y="136">PERMITTED</text>
        <text class="node-name" x="1080" y="160">Publication</text>
        <text class="node-sub" x="1080" y="180">no score · no ranking</text>
      </g>

      <g id="consent-to-evidence-legend" data-legend-position="bottom" data-legend-y="652">
        <path d="M40 620 H1240" stroke="rgba(45,49,66,.12)" stroke-width="1"/>
        <text class="legend-label" x="76" y="656">FLOW</text>
        <path class="connector" d="M136 652 H184" marker-end="url(#consent-to-evidence-arrow)"/>
        <text class="legend-text" x="196" y="656">evidence handoff</text>
        <path class="connector connector--accent" d="M376 652 H424" marker-end="url(#consent-to-evidence-arrow-accent)"/>
        <text class="legend-text" x="436" y="656">consent-controlled decision</text>
        <path class="connector connector--link" d="M720 652 H768" marker-end="url(#consent-to-evidence-arrow-link)"/>
        <text class="legend-text" x="780" y="656">allowed publication</text>
        <text class="node-sub" x="1136" y="656">UNRESOLVED is data, never inferred away</text>
      </g>
    </svg>
  </main>
</body>
</html>
