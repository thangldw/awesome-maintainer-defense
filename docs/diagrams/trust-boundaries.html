<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trust boundaries — Awesome Maintainer Defense</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --accent-tint:rgba(235,108,54,.08); --rule:rgba(45,49,66,.12); --link:#2e5aa8; }
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px 32px; background:var(--paper); color:var(--ink); font-family:'Geist',system-ui,sans-serif; }
    .frame { width:100%; max-width:1280px; }
    .eyebrow { margin-bottom:8px; color:var(--muted); font:500 12px/1 'Geist Mono',ui-monospace,monospace; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin-bottom:24px; color:var(--ink); font:400 clamp(28px,3vw,40px)/1.08 'Instrument Serif',serif; letter-spacing:-.02em; }
    svg { width:100%; min-width:900px; display:block; }
    .zone { fill:rgba(45,49,66,.02); stroke:rgba(45,49,66,.18); stroke-width:1; stroke-dasharray:6 4; }
    .zone-label,.tag,.legend-label { fill:var(--muted); font:500 8px 'Geist Mono',ui-monospace,monospace; letter-spacing:.12em; }
    .node rect { fill:#fff; stroke:rgba(45,49,66,.28); stroke-width:1; }
    .node--accent rect { fill:var(--accent-tint); stroke:var(--accent); stroke-width:1.5; }
    .node--external rect { fill:rgba(45,49,66,.03); stroke:rgba(45,49,66,.28); stroke-dasharray:5 4; }
    .node-name { fill:var(--ink); font:600 12px 'Geist',system-ui,sans-serif; text-anchor:middle; }
    .node-sub { fill:var(--soft); font:400 8px 'Geist Mono',ui-monospace,monospace; text-anchor:middle; }
    .connector { fill:none; stroke:var(--muted); stroke-width:1.2; }
    .connector--accent { stroke:var(--accent); stroke-width:1.2; }
    .connector--optional { stroke:var(--link); stroke-width:1; stroke-dasharray:5 4; }
    .blocked { fill:none; stroke:var(--muted); stroke-width:1.2; stroke-dasharray:5 4; }
    .flow-label { fill:var(--muted); font:400 8px 'Geist Mono',ui-monospace,monospace; text-anchor:middle; }
    .legend-text { fill:var(--ink); font:500 12px 'Geist',system-ui,sans-serif; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Secure paved road · Architecture · doc-wide</p>
    <h1>A read-only path from repository evidence to an authorized change</h1>
    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trust-boundaries-title trust-boundaries-desc">
      <title id="trust-boundaries-title">Awesome Maintainer Defense trust boundaries</title>
      <desc id="trust-boundaries-desc">The supported local route reads a repository offline, produces findings and a patch, and requires human authorization; live GitHub settings remain outside the inspected boundary.</desc>
      <defs>
        <marker id="trust-boundaries-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4f5d75"/></marker>
        <marker id="trust-boundaries-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#eb6c36"/></marker>
        <marker id="trust-boundaries-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="1280" height="720" fill="#f5f5f5"/>

      <rect class="zone" x="40" y="156" width="1000" height="324" rx="8"/>
      <rect x="60" y="148" width="184" height="20" rx="4" fill="#f5f5f5"/>
      <text class="zone-label" x="68" y="164">LOCAL INSPECTION BOUNDARY</text>
      <rect class="zone" x="1064" y="228" width="176" height="252" rx="8"/>
      <rect x="1080" y="220" width="140" height="20" rx="4" fill="#f5f5f5"/>
      <text class="zone-label" x="1088" y="236">EXTERNAL STATE</text>

      <path class="connector" d="M208 304 H232" marker-end="url(#trust-boundaries-arrow)"/>
      <path class="connector" d="M368 304 H392" marker-end="url(#trust-boundaries-arrow)"/>
      <path class="connector" d="M528 304 H552" marker-end="url(#trust-boundaries-arrow)"/>
      <path class="connector connector--accent" d="M688 304 H712" marker-end="url(#trust-boundaries-arrow-accent)"/>
      <path class="connector connector--optional" d="M848 304 H872" marker-end="url(#trust-boundaries-arrow-link)"/>
      <path class="blocked" d="M300 344 V440"/>
      <path d="M288 440 H312" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M292 448 L308 464 M308 448 L292 464" fill="none" stroke="#eb6c36" stroke-width="1.2"/>
      <text class="flow-label" x="364" y="424">no network call</text>
      <text class="flow-label" x="860" y="276">owner approval</text>

      <g class="node" data-node="repository-checkout">
        <rect x="72" y="264" width="136" height="80" rx="8"/>
        <text class="tag" x="88" y="284">INPUT</text>
        <text class="node-name" x="140" y="308">Repository</text>
        <text class="node-name" x="140" y="324">checkout</text>
        <text class="node-sub" x="140" y="340">authorized path</text>
      </g>
      <g class="node" data-node="offline-auditor">
        <rect x="232" y="264" width="136" height="80" rx="8"/>
        <text class="tag" x="248" y="284">READ ONLY</text>
        <text class="node-name" x="300" y="312">Offline auditor</text>
        <text class="node-sub" x="300" y="332">no code execution</text>
      </g>
      <g class="node" data-node="evidence-findings">
        <rect x="392" y="264" width="136" height="80" rx="8"/>
        <text class="tag" x="408" y="284">EVIDENCE</text>
        <text class="node-name" x="460" y="312">Findings</text>
        <text class="node-sub" x="460" y="332">location · risk</text>
      </g>
      <g class="node" data-node="reviewable-patch">
        <rect x="552" y="264" width="136" height="80" rx="8"/>
        <text class="tag" x="568" y="284">PATCH ONLY</text>
        <text class="node-name" x="620" y="312">Unified diff</text>
        <text class="node-sub" x="620" y="332">target unchanged</text>
      </g>
      <g class="node node--accent" data-node="human-review">
        <rect x="712" y="264" width="136" height="80" rx="8"/>
        <text class="tag" x="728" y="284" fill="#eb6c36">PRIVILEGED GATE</text>
        <text class="node-name" x="780" y="312">Human review</text>
        <text class="node-sub" x="780" y="332">context · tests</text>
      </g>
      <g class="node" data-node="authorized-apply">
        <rect x="872" y="264" width="136" height="80" rx="8"/>
        <text class="tag" x="888" y="284">OPTIONAL</text>
        <text class="node-name" x="940" y="308">Authorized</text>
        <text class="node-name" x="940" y="324">apply</text>
        <text class="node-sub" x="940" y="340">normal repo flow</text>
      </g>
      <g class="node node--external" data-node="github-settings">
        <rect x="1084" y="288" width="136" height="104" rx="8"/>
        <text class="tag" x="1100" y="308">NOT INSPECTED</text>
        <text class="node-name" x="1152" y="336">Live GitHub</text>
        <text class="node-name" x="1152" y="352">settings</text>
        <text class="node-sub" x="1152" y="372">rules · Apps · secrets</text>
      </g>

      <g id="trust-boundaries-legend" data-legend-position="bottom" data-legend-y="652">
        <path d="M40 628 H1240" stroke="rgba(45,49,66,.12)" stroke-width="1"/>
        <text class="legend-label" x="48" y="660">LEGEND</text>
        <path d="M136 656 H184" class="connector" marker-end="url(#trust-boundaries-arrow)"/>
        <text class="legend-text" x="196" y="660">supported local flow</text>
        <path d="M400 656 H448" class="connector connector--optional" marker-end="url(#trust-boundaries-arrow-link)"/>
        <text class="legend-text" x="460" y="660">optional after authorization</text>
        <path d="M752 656 H792" class="blocked"/>
        <path d="M780 648 L792 664 M792 648 L780 664" fill="none" stroke="#eb6c36" stroke-width="1.2"/>
        <text class="legend-text" x="808" y="660">outside the audit boundary</text>
      </g>
    </svg>
  </main>
</body>
</html>
