name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test auditor and installer
        run: make test
      - name: Exercise published source quickstart
        run: python scripts/test_quickstart.py
      - name: Validate catalog, governance, and generated documentation
        run: make validate
      - name: Audit this repository
        run: python scripts/install_kit.py audit . --fail-on medium
      - name: Build standalone release CLI
        run: python scripts/build_standalone.py
      - name: Verify committed release visuals
        run: python scripts/verify_release_assets.py
