name: Workflow security

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "kits/**/.github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "kits/**/.github/workflows/**"

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Analyze repository workflows and shipped kit workflows
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
